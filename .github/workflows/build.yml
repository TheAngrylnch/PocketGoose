name: Build Pocket Goose 1.0.0

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path './.git/*' -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit)"
            if [ -z "$ZIP" ]; then
              echo "No Gradle settings file or project ZIP found in the repository."
              exit 1
            fi
            mkdir -p .pocketgoose-unpacked
            unzip -q "$ZIP" -d .pocketgoose-unpacked
            ROOT="$(find .pocketgoose-unpacked -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit | xargs -r dirname)"
          fi
          if [ -z "$ROOT" ] || [ ! -f "$ROOT/app/build.gradle" ]; then
            echo "Could not find a valid Pocket Goose Android project (settings.gradle and app/build.gradle)."
            find . -maxdepth 4 -type f \( -name settings.gradle -o -name build.gradle \) -print
            exit 1
          fi
          ROOT="$(realpath "$ROOT")"
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Using Android project root: $ROOT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle -p "${{ steps.project.outputs.root }}" assembleDebug

      - name: Upload Pocket Goose APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Goose-1.0.0
          path: ${{ steps.project.outputs.root }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
