
name: Build Pocket Goose 1.0.2

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Pocket Goose project
        run: |
          unzip -q PocketGoose_1.0.2_Project.zip -d build-source
          
      - name: Build APK
        run: |
          gradle -p build-source/PocketGoose_1.0.2_Project assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pocket-Goose-1.0.2
          path: build-source/PocketGoose_1.0.2_Project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
